name: AI Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should the agent change?"
        required: true
        type: string
      model:
        description: "OpenAI model to use"
        required: false
        default: "gpt-5"
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-agent:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/agent ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Build agent task
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_TASK: ${{ inputs.task }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s' "$WORKFLOW_TASK" > .agent-task.txt
          else
            printf '%s' "${COMMENT_BODY#'/agent '}" > .agent-task.txt
          fi

      - name: Run AI coding agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model || 'gpt-5' }}
        run: python scripts/ai_coding_agent.py --task-file .agent-task.txt

      - name: Run tests
        run: python -m pytest

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if git diff --quiet; then
            echo "No changes produced by agent."
            exit 0
          fi

          branch="ai-agent/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .
          git commit -m "Apply AI coding agent changes"
          git push origin "$branch"

          body="Automated changes generated by the AI coding agent."
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            body="$body"$'\n\n'"Requested from issue #$ISSUE_NUMBER."
          fi

          gh pr create \
            --title "AI agent changes" \
            --body "$body" \
            --head "$branch"

